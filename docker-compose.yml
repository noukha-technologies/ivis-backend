services:
  postgres:
    image: postgres:16-alpine
    container_name: ivis-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-ivis_backend}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ivis_backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ivis_backend}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ivis_backend_postgres_data:
